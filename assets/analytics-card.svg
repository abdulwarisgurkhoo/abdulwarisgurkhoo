<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="statBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <style>
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="14" fill="url(#cardBg)" stroke="url(#statBorder)" stroke-width="1.2"/>

  <!-- Card Header -->
  <g transform="translate(35, 36)">
    <text x="0" y="0" fill="#00f2fe" class="f-mono" font-size="14" font-weight="700" letter-spacing="2">
      📊 DEVELOPER TELEMETRY &amp; CODEBASE METRICS
    </text>
    <text x="830" y="0" text-anchor="end" fill="#64748b" class="f-mono" font-size="11">
      VERIFIED GITHUB ACTIVITY
    </text>
  </g>
  <line x1="35" y1="52" x2="865" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- 4 Metric Pillars -->
  <!-- Metric 1: Repos -->
  <g transform="translate(35, 80)">
    <rect width="185" height="125" rx="10" fill="#0B1120" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" font-size="20">📁</text>
    <text x="20" y="68" fill="#38bdf8" class="f-sans" font-size="28" font-weight="900">25+</text>
    <text x="20" y="92" fill="#94a3b8" class="f-mono" font-size="11" font-weight="600">PUBLIC REPOSITORIES</text>
    <text x="20" y="108" fill="#64748b" class="f-mono" font-size="9">C++ • Python • Web • AI</text>
  </g>

  <!-- Metric 2: Achievement -->
  <g transform="translate(245, 80)">
    <rect width="185" height="125" rx="10" fill="#0B1120" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" font-size="20">🦈</text>
    <text x="20" y="68" fill="#a855f7" class="f-sans" font-size="24" font-weight="900">PULL SHARK</text>
    <text x="20" y="92" fill="#94a3b8" class="f-mono" font-size="11" font-weight="600">GITHUB BADGE</text>
    <text x="20" y="108" fill="#64748b" class="f-mono" font-size="9">Verified Pull Request Merge</text>
  </g>

  <!-- Metric 3: Academic & Level -->
  <g transform="translate(455, 80)">
    <rect width="185" height="125" rx="10" fill="#0B1120" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" font-size="20">🎓</text>
    <text x="20" y="68" fill="#10b981" class="f-sans" font-size="28" font-weight="900">YEAR 2</text>
    <text x="20" y="92" fill="#94a3b8" class="f-mono" font-size="11" font-weight="600">B.TECH CS &amp; ENG</text>
    <text x="20" y="108" fill="#64748b" class="f-mono" font-size="9">Algorithms • OS • Systems</text>
  </g>

  <!-- Metric 4: Multi-Domain Focus -->
  <g transform="translate(665, 80)">
    <rect width="195" height="125" rx="10" fill="#0B1120" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" font-size="20">⚡</text>
    <text x="20" y="68" fill="#f59e0b" class="f-sans" font-size="28" font-weight="900">QUAD-CORE</text>
    <text x="20" y="92" fill="#94a3b8" class="f-mono" font-size="11" font-weight="600">ENGINEERING FOCUS</text>
    <text x="20" y="108" fill="#64748b" class="f-mono" font-size="9">AI • Sec • IoT • Full-Stack</text>
  </g>
</svg>