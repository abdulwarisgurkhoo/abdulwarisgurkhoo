<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="coreAIGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="coreSecGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="coreIoTGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="coreFSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <style>
    .f-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Outer Canvas -->
  <rect width="100%" height="100%" rx="14" fill="#06090F" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Matrix Header -->
  <g transform="translate(30, 36)">
    <text x="0" y="0" fill="#38bdf8" class="f-mono" font-size="13" font-weight="700" letter-spacing="2">
      ⚡ MULTI-DISCIPLINARY ARCHITECTURE STACK
    </text>
    <text x="840" y="0" text-anchor="end" fill="#64748b" class="f-mono" font-size="11">
      QUAD-CORE SPECIALIZATION
    </text>
  </g>
  <line x1="30" y1="52" x2="870" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Core 1: AI & ML -->
  <g transform="translate(30, 68)">
    <rect width="195" height="185" rx="10" fill="url(#coreAIGrad)" stroke="#ec4899" stroke-width="1.2"/>
    <text x="20" y="32" font-size="24">🤖</text>
    <text x="20" y="65" fill="#f472b6" class="f-sans" font-size="15" font-weight="800">AI / ML CORE</text>
    <text x="20" y="85" fill="#94a3b8" class="f-mono" font-size="10" font-weight="600">NEURAL &amp; COGNITIVE</text>
    <line x1="20" y1="98" x2="175" y2="98" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="20" y="118" fill="#e2e8f0" class="f-mono" font-size="11">▸ TensorFlow</text>
    <text x="20" y="136" fill="#e2e8f0" class="f-mono" font-size="11">▸ Scikit-Learn</text>
    <text x="20" y="154" fill="#e2e8f0" class="f-mono" font-size="11">▸ OpenCV / Vision</text>
    <text x="20" y="172" fill="#e2e8f0" class="f-mono" font-size="11">▸ NumPy / Pandas</text>
  </g>

  <!-- Core 2: Network Security -->
  <g transform="translate(245, 68)">
    <rect width="195" height="185" rx="10" fill="url(#coreSecGrad)" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="20" y="32" font-size="24">🔐</text>
    <text x="20" y="65" fill="#22d3ee" class="f-sans" font-size="15" font-weight="800">CYBER SECURITY</text>
    <text x="20" y="85" fill="#94a3b8" class="f-mono" font-size="10" font-weight="600">DEFENSE &amp; PROTOCOLS</text>
    <line x1="20" y1="98" x2="175" y2="98" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="20" y="118" fill="#e2e8f0" class="f-mono" font-size="11">▸ TCP/IP / Subnetting</text>
    <text x="20" y="136" fill="#e2e8f0" class="f-mono" font-size="11">▸ Wireshark Analysis</text>
    <text x="20" y="154" fill="#e2e8f0" class="f-mono" font-size="11">▸ Kali Linux Tools</text>
    <text x="20" y="172" fill="#e2e8f0" class="f-mono" font-size="11">▸ Nmap / Firewalls</text>
  </g>

  <!-- Core 3: IoT & Embedded -->
  <g transform="translate(460, 68)">
    <rect width="195" height="185" rx="10" fill="url(#coreIoTGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="20" y="32" font-size="24">🔌</text>
    <text x="20" y="65" fill="#34d399" class="f-sans" font-size="15" font-weight="800">HARDWARE &amp; IoT</text>
    <text x="20" y="85" fill="#94a3b8" class="f-mono" font-size="10" font-weight="600">EMBEDDED SYSTEMS</text>
    <line x1="20" y1="98" x2="175" y2="98" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="20" y="118" fill="#e2e8f0" class="f-mono" font-size="11">▸ Arduino C/C++</text>
    <text x="20" y="136" fill="#e2e8f0" class="f-mono" font-size="11">▸ ESP32 / ESP8266</text>
    <text x="20" y="154" fill="#e2e8f0" class="f-mono" font-size="11">▸ MQTT / Telemetry</text>
    <text x="20" y="172" fill="#e2e8f0" class="f-mono" font-size="11">▸ Sensors &amp; Actuators</text>
  </g>

  <!-- Core 4: Full Stack & Cloud -->
  <g transform="translate(675, 68)">
    <rect width="195" height="185" rx="10" fill="url(#coreFSGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="20" y="32" font-size="24">⚡</text>
    <text x="20" y="65" fill="#fbbf24" class="f-sans" font-size="15" font-weight="800">FULL-STACK WEB</text>
    <text x="20" y="85" fill="#94a3b8" class="f-mono" font-size="10" font-weight="600">DISTRIBUTED SYSTEMS</text>
    <line x1="20" y1="98" x2="175" y2="98" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    
    <text x="20" y="118" fill="#e2e8f0" class="f-mono" font-size="11">▸ React / React Native</text>
    <text x="20" y="136" fill="#e2e8f0" class="f-mono" font-size="11">▸ Node.js &amp; Express</text>
    <text x="20" y="154" fill="#e2e8f0" class="f-mono" font-size="11">▸ MongoDB &amp; MySQL</text>
    <text x="20" y="172" fill="#e2e8f0" class="f-mono" font-size="11">▸ C++ Core Systems</text>
  </g>
</svg>