<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#080B10" />
    </linearGradient>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2230" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .cmd { fill: #00f2fe; font-weight: 700; }
    .label { fill: #94a3b8; }
    .val-str { fill: #a7f3d0; }
    .val-num { fill: #fbcfe8; }
    .val-kw { fill: #c084fc; font-weight: 700; }
    .val-bool { fill: #fde047; }
    .prompt { fill: #f43f5e; font-weight: 700; }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Window Container -->
  <rect x="10" y="10" width="880" height="360" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Window Header -->
  <path d="M 10 22 Q 10 10 22 10 L 878 10 Q 890 10 890 22 L 890 46 L 10 46 Z" fill="url(#termHeader)" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Window Controls -->
  <circle cx="34" cy="28" r="6" fill="#ef4444"/>
  <circle cx="54" cy="28" r="6" fill="#f59e0b"/>
  <circle cx="74" cy="28" r="6" fill="#10b981"/>

  <!-- Title in Window -->
  <text x="450" y="32" text-anchor="middle" fill="#64748b" class="mono" font-size="12" font-weight="600">
    bash — abdulwaris@quantum-node: ~ (zsh)
  </text>

  <!-- Terminal Session Content -->
  <g transform="translate(30, 80)" class="mono" font-size="13">
    <!-- Line 1: Command -->
    <text x="0" y="0">
      <tspan class="prompt">❯</tspan>
      <tspan fill="#3b82f6"> ~/core</tspan>
      <tspan fill="#64748b"> on </tspan>
      <tspan fill="#ec4899"> main</tspan>
      <tspan fill="#94a3b8"> [!] </tspan>
      <tspan class="cmd">./fetch-engineer-profile.sh --deep-scan</tspan>
    </text>

    <!-- Line 2: Output JSON format -->
    <text x="0" y="28">
      <tspan fill="#38bdf8">┌──[ SYSTEM TELEMETRY REPORT ]────────────────────────────────────────┐</tspan>
    </text>

    <text x="0" y="54">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • ARCHITECT       : </tspan>
      <tspan class="val-str">"Abdul Waris Gurkhoo"</tspan>
      <tspan class="label">  [Location: PK 🇵🇰]</tspan>
    </text>

    <text x="0" y="78">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • CORE ACADEMIC   : </tspan>
      <tspan class="val-kw">B.Tech Computer Science &amp; Engineering</tspan>
      <tspan class="label"> (Year 2)</tspan>
    </text>

    <text x="0" y="102">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • NEURAL / AI LAB : </tspan>
      <tspan fill="#10b981">[ACTIVE] </tspan>
      <tspan class="val-str">TensorFlow • Scikit-Learn • OpenCV • NumPy • Pandas</tspan>
    </text>

    <text x="0" y="126">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • CYBER &amp; SEC OPS : </tspan>
      <tspan fill="#10b981">[ACTIVE] </tspan>
      <tspan class="val-str">TCP/IP • Wireshark • Kali Linux • Nmap • Firewalls</tspan>
    </text>

    <text x="0" y="150">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • HARDWARE &amp; IoT  : </tspan>
      <tspan fill="#10b981">[ACTIVE] </tspan>
      <tspan class="val-str">Arduino • ESP32 • Sensors • Actuators • MQTT</tspan>
    </text>

    <text x="0" y="174">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • FULL-STACK WEB  : </tspan>
      <tspan fill="#10b981">[ONLINE] </tspan>
      <tspan class="val-str">React • Node.js • Express • MongoDB • MySQL • C++</tspan>
    </text>

    <text x="0" y="198">
      <tspan fill="#38bdf8">│</tspan>
      <tspan class="label">  • DISPOSITION     : </tspan>
      <tspan class="val-kw">"THINK BIG, EXECUTE WITH PRECISION, SCALE ENDLESSLY"</tspan>
    </text>

    <text x="0" y="222">
      <tspan fill="#38bdf8">└──[ STATUS: 100% OPERATIONAL • READY FOR HIGH-IMPACT COLLABORATIONS ]┘</tspan>
    </text>

    <!-- Line 3: Prompt waiting with cursor -->
    <text x="0" y="258">
      <tspan class="prompt">❯</tspan>
      <tspan fill="#3b82f6"> ~/core</tspan>
      <tspan fill="#94a3b8"> git push origin future --force</tspan>
      <tspan fill="#00f2fe" class="cursor"> █</tspan>
    </text>
  </g>
</svg>