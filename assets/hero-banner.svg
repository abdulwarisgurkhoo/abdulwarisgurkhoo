<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.95" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="80%" stop-color="#b06ab3" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chipAIGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.25" />
    </linearGradient>
    
    <linearGradient id="chipSecGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="chipIoTGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#64dd17" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="chipFSGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0.25" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.2" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#070A12" rx="16"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="16"/>
  
  <!-- Glowing Orbs -->
  <rect width="100%" height="100%" fill="url(#bgGlow1)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#bgGlow2)" rx="16"/>

  <!-- Outer Glass Frame -->
  <rect x="8" y="8" width="1184" height="384" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#subtleShadow)"/>

  <!-- Decorative Corner Brackets -->
  <path d="M 24 50 L 24 24 L 50 24" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1176 50 L 1176 24 L 1150 24" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  <path d="M 24 350 L 24 376 L 50 376" fill="none" stroke="#7928ca" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1176 350 L 1176 376 L 1150 376" fill="none" stroke="#7928ca" stroke-width="3" stroke-linecap="round"/>

  <!-- Top System Status Header Bar -->
  <g transform="translate(45, 45)">
    <!-- Terminal Dots -->
    <circle cx="10" cy="10" r="6" fill="#ff5f56" />
    <circle cx="30" cy="10" r="6" fill="#ffbd2e" />
    <circle cx="50" cy="10" r="6" fill="#27c93f" />

    <text x="80" y="14" fill="#00f2fe" class="mono-text" font-size="12" font-weight="700" letter-spacing="1.5">
      SYSTEM.OS // v4.8.0 :: NEURAL CORE ACTIVE
    </text>

    <!-- Live Status Pill Right -->
    <rect x="880" y="-3" width="220" height="26" rx="13" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="1"/>
    <circle cx="896" cy="10" r="4" fill="#00f2fe" class="pulse-dot"/>
    <text x="910" y="14" fill="#00f2fe" class="mono-text" font-size="11" font-weight="700" letter-spacing="1">
      STATUS: DEPLOYING 24/7
    </text>
  </g>

  <!-- Divider Line Top -->
  <line x1="45" y1="75" x2="1155" y2="75" stroke="#1f2937" stroke-width="1"/>
  <line x1="45" y1="75" x2="280" y2="75" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Center Hero Section -->
  <!-- Subtitle Tag Above Name -->
  <g transform="translate(600, 125)">
    <text text-anchor="middle" fill="#94a3b8" class="mono-text" font-size="13" font-weight="600" letter-spacing="4">
      &lt; COMPUTER SCIENCE ENGINEER &amp; MULTI-STACK ARCHITECT /&gt;
    </text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" fill="url(#titleGrad)" class="title-text" font-size="52" filter="url(#neonGlow)">
      ABDUL WARIS GURKHOO
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(600, 225)">
    <text text-anchor="middle" fill="#e2e8f0" class="mono-text" font-size="16" font-weight="500" letter-spacing="1.5">
      Pushing the Boundaries of AI • Cyber Warfare Defense • IoT Hardware • Scalable Web
    </text>
  </g>

  <!-- Four Interactive Tech Pillar Chips -->
  <g transform="translate(130, 265)">
    <!-- Chip 1: AI & ML -->
    <g transform="translate(0, 0)">
      <rect width="215" height="42" rx="21" fill="url(#chipAIGrad)" stroke="#ff007f" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="5" fill="#ff007f"/>
      <text x="38" y="26" fill="#ffffff" class="mono-text" font-size="12" font-weight="700">🤖 AI / DEEP LEARNING</text>
    </g>

    <!-- Chip 2: Network Security -->
    <g transform="translate(240, 0)">
      <rect width="225" height="42" rx="21" fill="url(#chipSecGrad)" stroke="#00f2fe" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="5" fill="#00f2fe"/>
      <text x="38" y="26" fill="#ffffff" class="mono-text" font-size="12" font-weight="700">🔐 NETWORK SECURITY</text>
    </g>

    <!-- Chip 3: IoT & Embedded -->
    <g transform="translate(490, 0)">
      <rect width="210" height="42" rx="21" fill="url(#chipIoTGrad)" stroke="#00c853" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="5" fill="#00c853"/>
      <text x="38" y="26" fill="#ffffff" class="mono-text" font-size="12" font-weight="700">🔌 IoT &amp; ARDUINO</text>
    </g>

    <!-- Chip 4: Full Stack -->
    <g transform="translate(725, 0)">
      <rect width="215" height="42" rx="21" fill="url(#chipFSGrad)" stroke="#ff9100" stroke-width="1.2"/>
      <circle cx="24" cy="21" r="5" fill="#ff9100"/>
      <text x="38" y="26" fill="#ffffff" class="mono-text" font-size="12" font-weight="700">⚡ FULL-STACK CLOUD</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="45" y1="340" x2="1155" y2="340" stroke="#1f2937" stroke-width="1"/>
  <line x1="920" y1="340" x2="1155" y2="340" stroke="#7928ca" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Bottom Footer Telemetry -->
  <g transform="translate(45, 368)">
    <text x="0" y="0" fill="#64748b" class="mono-text" font-size="11" font-weight="600">
      📍 LOCATION: PAKISTAN 🇵🇰
    </text>
    <text x="240" y="0" fill="#64748b" class="mono-text" font-size="11" font-weight="600">
      🎓 DEGREE: B.TECH CSE (YEAR 2)
    </text>
    <text x="560" y="0" fill="#64748b" class="mono-text" font-size="11" font-weight="600">
      🔥 MINDSET: "THINK BIG, ACHIEVE BIG"
    </text>
    <text x="920" y="0" fill="#00f2fe" class="mono-text" font-size="11" font-weight="700">
      ⚡ LATENCY: 0.1ms // 100% PASSION
    </text>
  </g>
</svg>